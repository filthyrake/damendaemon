name: CPU contracts

on:
  push:
    paths:
      - 'dllm/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cpu-contracts.yml'
  pull_request:
    paths:
      - 'dllm/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/cpu-contracts.yml'

permissions:
  contents: read

concurrency:
  group: cpu-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Python ${{ matrix.python }} contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Dependency-free contracts
        run: |
          python -S -m unittest \
            tests.test_qualification_optimization \
            tests.test_verifier_http_errors \
            tests.test_report_io \
            tests.test_error_state \
            tests.test_token_workload \
            tests.test_manifest_preflight \
            tests.test_checkpoint_json \
            tests.test_tokenizer_metadata \
            tests.test_stopping \
            tests.test_quota_timeout \
            tests.test_compare_llama tests.test_compare_rerank tests.test_compare_a2_preflight tests.test_comparison_prompt_files \
            tests.test_bench
      - name: Optimized dependency-free contracts
        run: |
          python -S -O -m unittest \
            tests.test_qualification_optimization \
            tests.test_verifier_http_errors \
            tests.test_report_io \
            tests.test_error_state \
            tests.test_token_workload \
            tests.test_manifest_preflight \
            tests.test_checkpoint_json \
            tests.test_tokenizer_metadata \
            tests.test_stopping \
            tests.test_quota_timeout \
            tests.test_compare_llama tests.test_compare_rerank tests.test_compare_a2_preflight tests.test_comparison_prompt_files \
            tests.test_bench

  runtime-integration:
    name: CPU runtime and tokenizer integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --only-binary=:all: torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: safetensors==0.5.3 tokenizers==0.21.1 'jinja2>=3.1.6,<4' 'numpy>=1.26,<3' gguf==0.19.0 sentencepiece==0.2.2 'protobuf>=4.25,<8'
          # Explicit dependencies avoid xgrammar's Linux Triton dependency;
          # these tests compile grammars and apply masks on CPU only.
          python -m pip install --only-binary=:all: transformers==4.51.3 'pydantic>=2,<3' apache-tvm-ffi==0.1.11
          python -m pip install --only-binary=:all: --no-deps xgrammar==0.2.8
      - name: Verify CPU-only PyTorch
        run: |
          python - <<'PY'
          import torch
          if torch.version.cuda is not None or torch.version.hip is not None or torch.cuda.is_available():
              raise RuntimeError('Integration tests require a CPU-only PyTorch build')
          print('CPU-only PyTorch:', torch.__version__)
          PY
      - name: Explicit local integration tests
        run: |
          python -m unittest \
            tests.test_runtime \
            tests.test_sampling \
            tests.test_logprobs \
            tests.test_structured \
            tests.test_gguf_grammar \
            tests.test_model_manifest \
            tests.test_checkpoint_inventory \
            tests.test_host_tensor_channel \
            tests.test_remote_quota_transport \
            tests.test_server \
            tests.test_http_auth \
            tests.test_chat_template \
            tests.test_chat_template_loops \
            tests.test_deepseek_text \
            tests.test_deepseek_tools \
            tests.test_deepseek_output \
            tests.test_deepseek_tool_prompt \
            tests.test_bytelevel_stream \
            tests.test_tool_stream_cleanup \
            tests.test_glm_flash_tools \
            tests.test_glm_flash_tool_generation \
            tests.test_cpu_reference_chat \
            tests.test_harmony \
            tests.test_tool_calls \
            tests.test_awq_model \
            tests.test_gguf_sentencepiece \
            tests.test_gguf_bpe_specials \
            tests.test_gguf \
            tests.test_gguf_split \
            tests.test_dense_eos_preflight \
            tests.test_vision_load_preflight \
            tests.test_vision_weight_budget \
            tests.test_vision_inputs \
            tests.test_vision_positions \
            tests.test_vision_prompt \
            tests.test_vision_executor_preflight \
            tests.test_embeddings \
            tests.test_encoder_cpu_reference \
            tests.test_rotary \
            tests.test_t5 \
            tests.test_mamba \
            tests.test_mamba2 \
            tests.test_reranking \
            tests.test_paged_cleanup \
            tests.test_paged_completion \
            tests.test_scheduler_worker_failure \
            tests.test_scheduler \
            tests.test_scheduler_status \
            tests.test_scheduler_error_memory
