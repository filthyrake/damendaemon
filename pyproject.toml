[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damendaemon"
version = "0.0.2"
description = "Independent NVIDIA inference prototype with model residency and CUDA graphs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
damendaemon = "damendaemon.cli:main"

[project.optional-dependencies]
runtime = ["torch==2.6.0; sys_platform != 'darwin'", "torch==2.13.0; sys_platform == 'darwin'", "safetensors==0.5.3", "tokenizers==0.21.1", "huggingface-hub==0.30.2", "jinja2>=3.1.6,<4"]
validation = ["transformers==4.51.3"]
structured = ["xgrammar==0.2.8", "transformers==4.51.3"]
gguf = ["gguf==0.19.0", "sentencepiece==0.2.2", "protobuf>=4.25,<8"]
hybrid = ["fla-core==0.4.2", "einops==0.8.1"]
vision = ["Pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["damendaemon*"]
