[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dllm"
version = "0.0.2"
description = "Independent NVIDIA inference prototype with model residency and CUDA graphs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dllm = "dllm.cli:main"

[project.optional-dependencies]
runtime = ["torch==2.6.0", "safetensors==0.5.3", "tokenizers==0.21.1", "huggingface-hub==0.30.2", "jinja2>=3.1.6,<4"]
validation = ["transformers==4.51.3"]

[tool.setuptools.packages.find]
include = ["dllm*"]
